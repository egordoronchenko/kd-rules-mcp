# MCP-сервер правил обмена «Конвертации данных 2».
#
# Публикация, имя контейнера и том кэша — переменные (умолчания: своя машина, порт 8060):
#   KD2_BIND, KD2_PUBLISHED_PORT, KD2_CONTAINER, KD2_CACHE_VOLUME.
# Имя проекта — name ниже. Подстановка ${COMPOSE_PROJECT_NAME:-…} поддерживается, и заданный
# COMPOSE_PROJECT_NAME перекрывает name. Эти переменные пишет scripts/setup_local.py в .env
# по projects.local.yaml (bind, port, instance). Без .env действуют умолчания.
#
# Первый запуск на машине:
#   1. projects.local.example.yaml → projects.local.yaml, указать папки проектов;
#   2. uv run python scripts/setup_local.py   — пишет .env, docker-compose.override.yml и .mcp.json;
#   3. docker compose up -d --build
#
# Пересоздать контейнер, не трогая том кэша структур:  docker compose up -d --force-recreate
# После правки projects.local.yaml — снова setup_local.py и docker compose up -d.
#
# Здесь нет путей конкретной машины. Папки проектов (только на чтение, /projects/<проект>),
# KD2_PROJECT_DIRS и KD2_PATH_MAP (перевод путей агента в пути контейнера) — в
# docker-compose.override.yml, его compose подхватывает сам. KD2_HOST, KD2_PORT, KD2_CACHE_DIR
# и KD2_WORKSPACE заданы в образе. Для команды setup_local.py задаёт KD2_TOKEN в override
# и KD2_BIND в .env. Клиент на этой машине: http://localhost:8060/mcp

name: "${COMPOSE_PROJECT_NAME:-kd-rules-mcp}"

services:
  kd-rules-mcp:
    container_name: ${KD2_CONTAINER:-kd_rules_mcp}
    build: .
    ports:
      - "${KD2_BIND:-127.0.0.1}:${KD2_PUBLISHED_PORT:-8060}:8060"
    restart: unless-stopped
    environment:
      KD2_PROJECTS_FILE: /config/projects.yaml
    volumes:
      - ./projects.yaml:/config/projects.yaml:ro
      - ./structures:/structures:ro
      - kd2_cache:/data/cache
      - ./workspace:/data/workspace

volumes:
  kd2_cache:
    name: ${KD2_CACHE_VOLUME:-kd2_structures_cache}
